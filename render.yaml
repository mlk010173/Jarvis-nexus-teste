# JARVIS NEXUS — deploy online ao vivo (Render, plano gratuito, sem cartão)
#
# Este blueprint sobe DOIS serviços:
#   1) jarvis-nexus     — o superagente (web service, free)
#   2) jarvis-n8n       — n8n para orquestrar automações (Docker, free)
#                         UI: https://SEU-APP.onrender.com/  usuário/senha definidos em env
#
# Variáveis para configurar NO PAINEL do Render (Settings > Environment):
#   GEMINI_API_KEY (grátis: https://aistudio.google.com/apikey), OPENROUTER_API_KEY,
#   GROQ_API_KEY, XAI_API_KEY, MOONSHOT_API_KEY, NVIDIA_NIM_API_KEY,
#   BASE44_API_KEY + BASE44_AGENT_ID, WAKE_TOKEN, OWNER_WHATSAPP,
#   WHATSAPP_TOKEN + WHATSAPP_PHONE_ID (Cloud API) — ou bridge local,
#   GMAIL_USER + GMAIL_PASS (senha de app), CORS_ORIGIN
services:
  - type: web
    name: jarvis-nexus
    runtime: node
    plan: free
    buildCommand: npm ci --legacy-peer-deps && npm run build && (npx playwright install chromium || true)
    startCommand: npx tsx server.ts
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
  - type: web
    name: jarvis-n8n
    runtime: docker
    plan: free
    dockerfilePath: ./n8n.Dockerfile
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: N8N_BASICAUTH_USER
        sync: false
      - key: N8N_BASICAUTH_PASSWORD
        sync: false
      - key: GENERIC_TIMEZONE
        value: America/Sao_Paulo
      - key: JARVIS_WAKE_URL
        value: http://jarvis-nexus.onrender.com/api/wake
