<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Superagent Clone</title>
<style>
  :root { --bg:#0e0f12; --card:#16181d; --muted:#8b90a0; --primary:#6d5dfc; --text:#e8eaf0; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,sans-serif; background:var(--bg); color:var(--text); display:flex; flex-direction:column; height:100vh; }
  header { padding:14px 18px; border-bottom:1px solid #232630; font-weight:600; }
  #chat { flex:1; overflow-y:auto; padding:18px; display:flex; flex-direction:column; gap:10px; }
  .msg { max-width:78%; padding:10px 14px; border-radius:12px; white-space:pre-wrap; line-height:1.45; }
  .user { align-self:flex-end; background:var(--primary); color:#fff; }
  .agent { align-self:flex-start; background:var(--card); border:1px solid #232630; }
  form { display:flex; gap:8px; padding:14px 18px; border-top:1px solid #232630; }
  input { flex:1; padding:12px 14px; border-radius:10px; border:1px solid #2a2d38; background:var(--card); color:var(--text); }
  button { padding:12px 18px; border:0; border-radius:10px; background:var(--primary); color:#fff; font-weight:600; cursor:pointer; }
</style>
</head>
<body>
<header>🤖 Superagent Clone (Ollama local)</header>
<div id="chat"></div>
<form id="f"><input id="i" placeholder="Fala com o agente..." autocomplete="off"><button>Enviar</button></form>
<script>
const chat = document.getElementById('chat');
const AGENT = window.AGENT_URL || 'http://localhost:8000';
function add(text, who) {
  const d = document.createElement('div');
  d.className = 'msg ' + who; d.textContent = text; chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
}
document.getElementById('f').onsubmit = async (e) => {
  e.preventDefault();
  const v = document.getElementById('i').value.trim(); if (!v) return;
  document.getElementById('i').value = '';
  add(v, 'user'); add('... pensando e executando', 'agent');
  try {
    const r = await fetch(AGENT + '/chat', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ message: v, user_id: 'owner', channel: 'web' })});
    const d = await r.json();
    chat.lastChild.remove(); add(d.reply || '(sem resposta)', 'agent');
  } catch (err) { chat.lastChild.remove(); add('erro: ' + err.message, 'agent'); }
};
</script>
</body>
</html>
