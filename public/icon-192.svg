<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0e7490" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="192" height="192" rx="40" fill="#030712"/>
  <circle cx="96" cy="96" r="80" fill="url(#bg)" stroke="url(#neon)" stroke-width="2" stroke-dasharray="8 4" opacity="0.6"/>
  <!-- Helmet / Visor Shape -->
  <path d="M56 86 C56 60 74 46 96 46 C118 46 136 60 136 86 C136 112 120 136 96 142 C72 136 56 112 56 86 Z" fill="none" stroke="url(#neon)" stroke-width="5" filter="url(#glow)"/>
  <!-- Glowing Eye / Core Visor line -->
  <path d="M72 88 Q96 98 120 88" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" fill="none" filter="url(#glow)"/>
  <circle cx="96" cy="92" r="5" fill="#ffffff" filter="url(#glow)"/>
  <!-- Headset / Neural Ear nodes -->
  <rect x="44" y="80" width="8" height="24" rx="4" fill="url(#neon)"/>
  <rect x="140" y="80" width="8" height="24" rx="4" fill="url(#neon)"/>
</svg>
